# Local run: the gateway with in-memory state, plus Ollama for free local models.
#   docker compose up --build
#   docker compose exec ollama ollama pull qwen2.5:3b
services:
  gateway:
    build: .
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
volumes:
  ollama:
