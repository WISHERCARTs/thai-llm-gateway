name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (fake providers, no API key needed)
        run: pytest -q
      - name: Guardrail eval must not regress
        run: python -m evals.guardrails.run --check > guardrail-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardrail-eval
          path: guardrail-eval.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t thai-llm-gateway .
      - name: Smoke test
        run: |
          docker run -d --name gw -p 8080:8080 -e GATEWAY_CLIENT_KEYS=ci:ci-key thai-llm-gateway
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/v1/models -H "Authorization: Bearer ci-key"
